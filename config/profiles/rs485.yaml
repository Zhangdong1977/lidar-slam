# Hardware profile: RS-485 physical chassis + IMU + encoder odometry
# Real Ackermann chassis controlled via RS-485 protocol, sensors from car_base_node

hardware_profile: "rs485"
use_sim_time: false
domain_id: 30

chassis:
  type: "rs485"
  serial_port: "/dev/ttyUSB1"
  baudrate: 115200

sensors:
  lidar:
    type: "rplidar"
    model: "rplidar_s2l"
    frame: "laser"
    serial_port: "/dev/ttyUSB0"
    baudrate: 1000000
  imu:
    type: "car_base"
    topic: "imu/data_raw"   # use car_base's internal Mahony output (bias-calibrated)
    # car_base_node publishes /imu/data_raw with bias-corrected orientation
    # but raw (un-bias-corrected) angular_velocity (~25°/s gyro bias on X).
    # When true, launch overrides ekf imu0_config to disable vyaw fusion.
    angular_velocity_biased: true
  odom:
    type: "car_base"
    topic: "odom"

frames:
  base_frame: "base_link"
  odom_frame: "odom"
  lidar_frame: "laser"

sensing:
  type: "ekf"  # EKF fuses /odom + /imu

vehicle:
  wheel_base: 0.58
  max_steering_angle: 0.5236
  max_velocity: 1.4
  lidar_height: 0.22
