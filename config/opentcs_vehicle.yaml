opentcs_vehicle_node:
  ros__parameters:
    vehicle_name: "ackermann_robot"
    # access_identity 默认跟随 vehicle_name（多车场景由 dispatch.sh 注入 vehicle_name，
    # 单车默认 = 上面的 vehicle_name）。需要独立设置时取消下一行注释。
    # access_identity: "ackermann_robot"
    namespace: "c30_1"
    domain_id: 30
    base_frame: "body_link"
    map_frame: "map"
    # Sidecar topics are auto-constructed from vehicle_name:
    #   /{vehicle_name}/amcl_pose, /{vehicle_name}/goal_pose, etc.
    # Override below only if you need a custom topic name.
    # amcl_pose_topic: "/ackermann_robot/amcl_pose"
    # goal_pose_topic: "/ackermann_robot/goal_pose"
    # robot_state_topic: "/ackermann_robot/robot_state"
    # battery_state_topic: "/ackermann_robot/battery_state"
    nav_action_name: "navigate_to_pose"
    pose_publish_rate: 10.0
    status_sample_ms: 1000
    heartbeat_timeout_ms: 30000
    cancel_timeout_ms: 5000
    max_speed: 1.4
    battery_sim_enabled: true
    battery_sim_start_percent: 95.0
    battery_sim_drain_rate: 5.0
    goal_order_id_parse: true
    emergency_stop_topic: ""
    safety_stop_topic: ""
    obstacle_detection_mode: "collision_monitor"
    obstacle_scan_threshold: 0.5
    obstacle_scan_angle_window: 1.047
    battery_real_topic: "battery_state_real"
    odom_topic: "odom"
    amcl_subscribe_topic: "amcl_pose"
    position_report_topic: ""
    map_yaml_file: ""
    error_auto_recover_ms: 10000
    goal_bounds_check_enabled: true
    goal_bounds_tolerance: 0.5
    goal_reject_unknown_cost: true
